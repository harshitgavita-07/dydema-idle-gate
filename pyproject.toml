[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dydema-idle-gate"
version = "0.1.0"
description = "Confidence, dwell, refractory and drift gating for Dydema-style EEG command predictions"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
idle-gate = "idle_gate.cli:main"

[tool.setuptools.packages.find]
include = ["idle_gate*"]
